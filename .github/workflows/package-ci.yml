name: Package CI

on:
  push:
    branches: [main, master]
    paths:
      - 'nucxplore/**'
      - 'nucxplore-pipeline/**'
      - '.github/workflows/package-ci.yml'
      - '.github/workflows/publish-pypi.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'nucxplore/**'
      - 'nucxplore-pipeline/**'
      - '.github/workflows/package-ci.yml'
      - '.github/workflows/publish-pypi.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nucxplore

jobs:
  lint:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo test --all-targets --all-features

  test-python:
    name: Test wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip maturin
      - run: maturin build --release --out dist --interpreter python
      - run: python -m pip install --force-reinstall dist/nucxplore-*.whl pytest pillow scipy
      - run: python -m pytest tests -q

  test-pipeline-python:
    name: Test pipeline Python contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucxplore-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy pandas joblib threadpoolctl 'xgboost==3.1.3' 'scikit-learn==1.8.0'
      - run: python -m pytest tests/test_cell_type_predict.py tests/test_pipeline_contract.py -q -k 'not stub_pipeline_contract'

  test-nextflow-contract:
    name: Test Nextflow stage contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucxplore-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.7'
      - run: NXF_ANSI_LOG=false bash tests/run_stub_pipeline_checks.sh
