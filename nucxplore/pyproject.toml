[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "nucxplore"
version = "0.3.0"
description = "High-performance histopathology feature extraction with GPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "NucXplore Team"}
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
batch = ["pillow>=10,<12", "scipy>=1.10,<2"]
dev = [
    "numpy>=1.24,<3",
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pillow>=10.0",
    "scikit-image>=0.19",
    "scipy>=1.7",
]
[project.urls]
Homepage = "https://github.com/the-ahuja-lab/NucXplore"
Repository = "https://github.com/the-ahuja-lab/NucXplore"
Issues = "https://github.com/the-ahuja-lab/NucXplore/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "nucxplore._core"
python-source = "python"
python-packages = ["nucxplore", "nuqr_featurizer"]
